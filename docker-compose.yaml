x-airflow-common: &airflow-common
  build: .
  environment:
    - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - PYTHONPATH=/app
  volumes:
    - airflow_data:/opt/airflow
    - ./dags:/opt/airflow/dags
    - .:/app

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: >
      /bin/bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  # optional: notebooks (EDA, monitoring charts) in the same image
  jupyter:
    <<: *airflow-common
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    entrypoint: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--notebook-dir=/app",
                 "--ServerApp.token=''", "--ServerApp.disable_check_xsrf=True"]

volumes:
  airflow_data:
